#
# Talismans
# by Auxilor
#

crafting:
  discover: true # If players should automatically have recipes added to their crafting table.

read-inventory: true # If a player's inventory should be checked for talismans
read-enderchest: true # If a player's ender chest should be checked for talismans
read-shulkerboxes: true # If a player's shulker boxes should be checked for talismans
top-level-only: true # If only the top level of any given talisman should be activated
talisman-limit: 54  # Set to 0 to use permission-based limits instead

offhand-only: false # If talismans or shulkers of talismans need to be in the offhand to work

bag:
  title: "Talisman Bag"
  blocked-item: black_stained_glass_pane name:"&cYour talisman bag is not big enough!"
  blocked-item-lore: [ ]
  size: 0 # Set to 0 to use permission-based bag size instead

  # A close button. Bag slots move around it, so the bag keeps its full size.
  # Buttons and custom slots only show when the bag has enough rows to reach them.
  close:
    enabled: false
    item: barrier name:"&cClose"
    location:
      row: 6
      column: 5

  # Extra items in the bag, such as a back button or decorations. Bag slots move around them.
  # Each one takes item, lore, a location (or a locations list) and click commands, for example:
  # - item: arrow name:"&fBack"
  #   location:
  #     row: 6
  #     column: 1
  #   left-click:
  #     - "menu open main"
  custom-slots: [ ]

# Optional features (opt-in early by choice).
opt-in:
  # Stop applying talismans.fromtable.<id> to talismans with no 'crafting-permission'. Becomes the default in 2026.44.
  disable-fromtable-permission: false
